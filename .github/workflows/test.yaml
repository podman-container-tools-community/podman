name: test

# Builds one upstream release without publishing anything, runs the functional tests
# (hack/functional-test.sh) against the amd64 binaries, as root and rootless, and builds
# and tests the image (hack/image-test.sh). Both run bats-core; each test case shows up
# in the log.
#
# Upstream's system and e2e tests are not run: they expect a test VM set up by
# upstream's CI and a matching podman-testing binary, so they fail for reasons
# unrelated to the binary.

on:
  workflow_call:
    inputs:
      version:
        description: Upstream tag, e.g. v6.1.4
        type: string
        required: true
      cache:
        description: Restore and save the C sysroot in the Actions cache (pull request CI only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/podman
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .build
          persist-credentials: false

      - uses: ./.build/.github/actions/setup
        with:
          version: ${{ inputs.version }}
          cache: ${{ inputs.cache }}

      - name: Build
        run: goreleaser release --config "${GORELEASER_CONFIG}" --clean --skip=publish,sign

      - name: Smoke test
        run: |
          go version -m dist/podman_linux_amd64_v1/podman
          dist/podman_linux_amd64_v1/podman --version
          dist/podman-remote_linux_amd64_v1/podman-remote --version
          for binary in dist/*_linux_*/*; do
            file "${binary}" | tee /dev/stderr | grep -q 'statically linked'
          done

      # Ubuntu 26.04, like 24.04, denies unprivileged user namespaces to unconfined
      # processes, which the rootless tests need.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Functional tests
        run: .build/hack/functional-test.sh dist

      - name: Image tests
        run: .build/hack/image-test.sh dist
