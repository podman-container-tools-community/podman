name: test

# Builds one upstream release without publishing anything, runs functional tests
# (hack/functional-test.sh) against the amd64 binaries and tests the image
# (hack/image-test.sh).
#
# Upstream's system and e2e tests are not run: they expect a test VM set up by
# upstream's CI and a matching podman-testing binary, so they fail for reasons
# unrelated to the binary.

on:
  workflow_call:
    inputs:
      version:
        description: Upstream tag, e.g. v6.1.4
        type: string
        required: true
      cache:
        description: Restore and save the libseccomp build in the Actions cache (pull request CI only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/podman
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .build
          persist-credentials: false

      - uses: ./.build/.github/actions/setup
        with:
          version: ${{ inputs.version }}
          cache: ${{ inputs.cache }}

      # dockers_v2 builds and pushes in one step, so a dry run cannot build images.
      - name: Build
        run: goreleaser release --config .build/.goreleaser.yaml --clean --skip=publish,sign,docker
        env:
          IS_LATEST: "false"
          IS_LATEST_MINOR: "false"
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Smoke test
        run: |
          go version -m dist/podman_linux_amd64_v1/podman
          dist/podman_linux_amd64_v1/podman --version
          dist/podman-remote_linux_amd64_v1/podman-remote --version
          for binary in dist/*_linux_*/*; do
            file "${binary}" | tee /dev/stderr | grep -q 'statically linked'
          done

      # bats from .build/mise.toml, checked against .build/mise.lock. Its bin directory,
      # not the shims, goes on PATH, so bats also runs outside .build/ and its installation
      # can be mounted into the functional test container.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: .build
          add_shims_to_path: false
          cache: false

      # Ubuntu 26.04, like 24.04, denies unprivileged user namespaces to unconfined
      # processes, which includes the rootless tests in the privileged container.
      - name: Functional tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          .build/hack/functional-test.sh dist

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the image for both architectures from dist/ as goreleaser would (no
      # emulation needed) and runs the amd64 one as root and rootless.
      - name: Image tests
        run: .build/hack/image-test.sh dist
