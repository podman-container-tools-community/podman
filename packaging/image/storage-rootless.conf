# Rootless storage for the podman user: native overlay, which works rootless on
# current kernels as long as /home/podman/.local/share/containers is a volume and not
# the image's overlay. Alpine's fuse-overlayfs 1.16 is installed for older kernels
# (mount_program = "/usr/bin/fuse-overlayfs"), but containers on it fail to start on
# kernel 7.0. A user's storage.conf replaces /etc/containers/storage.conf, so the
# additional image store is repeated here.
[storage]
driver = "overlay"

[storage.options]
additionalimagestores = ["/var/lib/shared"]
