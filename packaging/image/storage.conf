# Alpine's storage.conf plus upstream's additional image store in /var/lib/shared, for
# a read-only image store mounted there. Upstream's fsync=0 is a fuse-overlayfs option
# and breaks native overlay.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = ["/var/lib/shared"]

[storage.options.overlay]
mountopt = "nodev"
