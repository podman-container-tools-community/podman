# Rootless podman inside a container, as in upstream's image. Without --privileged the
# outer container's /proc has masked paths, so the kernel refuses to mount a new /proc
# for a nested container; containers bind-mount the outer one instead. Sysctls cannot
# be set in the shared network namespace.
[containers]
volumes = [
  "/proc:/proc",
]
default_sysctls = []
