# podman inside a container, as in upstream's quay.io/podman/stable image: containers
# share the outer container's namespaces, and there is no systemd or cgroup delegation.
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
