# Installed by the podman-container-tools-community package to
# /etc/containers/containers.conf.d/. podman is built with the systemd tag, so on a
# systemd host it defaults to the systemd cgroup manager and systemd timers for health
# checks, as the distribution's podman does. Reading the journal is not possible from a
# static binary (libsystemd is loaded with dlopen at run time), so logs and events stay
# in files; with journald, `podman logs` and `podman events` would fail.
[containers]
log_driver = "k8s-file"

[engine]
events_logger = "file"
